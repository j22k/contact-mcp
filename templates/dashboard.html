<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collected Contacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <div class="masthead">
      <span class="brand">User Information Collector</span>
      <nav class="site-nav">
        <a href="/" class="active" aria-current="page">Contacts</a>
        <a href="/docs">Docs</a>
      </nav>
    </div>
    <hr class="rule-hairline">

    <header class="page-header">
      <div>
        <span class="eyebrow">Dashboard</span>
        <h1>Contacts</h1>
      </div>
      <div>
        <span class="meta">{{count}} record(s) stored</span><br>
        <a class="btn" href="/">Refresh &rarr;</a>
      </div>
    </header>

    <hr class="rule">

    <div class="table-wrap interactive">
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Created</th><th>Actions</th></tr>
        </thead>
        <tbody>{{rows}}</tbody>
      </table>
    </div>

    <footer class="page-footer">Data stored locally via SQLite &middot; MCP tools: insert_contact, delete_contact &middot; <a href="/docs">Read the docs &rarr;</a></footer>
  </main>
</body>
</html>
